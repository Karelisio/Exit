name: Build

# Tests sur toutes les branches. Sur main : APK release signé ; si le tag vX.Y.Z (lu dans VERSION)
# n'existe pas encore, création du tag et d'une release GitHub avec l'APK et le changelog.
# Si le tag existe déjà : build de vérification seulement.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: SDK Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - name: Tests (moteur du plan, gains, stats, rendu des écrans)
        run: ./gradlew :app:testDebugUnitTest
      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: app/build/reports/tests/

  apk:
    name: APK et release
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # Création du tag et de la release GitHub.
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      EXIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      EXIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      EXIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # versionCode toujours croissant : chaque build peut mettre à jour le précédent.
      EXIT_VERSION_CODE: ${{ github.run_number }}
      # Dépôt dont l'appli suit les releases (mises à jour in-app).
      EXIT_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version (fichier VERSION)
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION contient « $version » : format attendu X.Y.Z"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then exists=true; else exists=false; fi
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$exists" = false ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo "::notice::Le tag $tag existe déjà : build de vérification, pas de release."
          elif [ "$publish" = true ]; then
            echo "::notice::Nouvelle version $version : release $tag."
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: SDK Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
      - name: Restaurer le keystore
        id: keystore
        run: |
          missing=""
          for name in KEYSTORE_BASE64 EXIT_KEYSTORE_PASSWORD EXIT_KEY_ALIAS EXIT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            if [ "${{ steps.version.outputs.publish }}" = true ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Secrets manquants :$missing (voir le README, section « Secrets GitHub »)"
              exit 1
            fi
            echo "::warning::Secrets absents : APK debug non signé pour vérification."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/exit-release.jks"
          echo "EXIT_KEYSTORE_FILE=$RUNNER_TEMP/exit-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Construire l'APK release (R8 + signature)
        if: steps.keystore.outputs.signed == 'true'
        run: |
          ./gradlew :app:assembleRelease
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "exit-${{ steps.version.outputs.version }}.apk"
      - name: Construire l'APK debug (vérification sans secrets)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          ./gradlew :app:assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "exit-${{ steps.version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: exit-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: exit-*.apk
          if-no-files-found: error
      - name: Changelog
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          # Section « ## X.Y.Z » de CHANGELOG.md si elle existe, sinon les commits depuis la release précédente.
          if [ -f CHANGELOG.md ] && grep -qE "^## \[?$version\]?" CHANGELOG.md; then
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > release-notes.md
          else
            previous="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD > release-notes.md
          fi
          sed -i '/./,$!d' release-notes.md
          [ -s release-notes.md ] || echo "Exit $version" > release-notes.md
          cat release-notes.md
      - name: Publier la release GitHub
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" "exit-${{ steps.version.outputs.version }}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Exit ${{ steps.version.outputs.version }}" --notes-file release-notes.md --latest
      - name: Effacer les secrets du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/exit-release.jks"
